# muuny.com — nginx-Block fuer den Edge-Container von con.ax (Stand 23.09.2026).
#
# Liegt auf dem Server als /opt/muuny/nginx/muuny.conf und wird als ZWEITE Datei nach
# /etc/nginx/conf.d/muuny.conf gemountet. core-edge.conf (con.ax) bleibt unberuehrt.
#
# con.ax darf nie von muuny abhaengen:
#  * Der Upstream wird ueber eine Variable und Dockers internen Resolver aufgeloest.
#    Laeuft muuny-web nicht, startet nginx trotzdem und muuny.com antwortet 502 —
#    ein fester "upstream muuny-web:8098" wuerde beim Start den ganzen nginx
#    (und damit con.ax) umwerfen.
#  * Einbau erst, wenn muuny.crt/muuny.key liegen (sonst startet nginx nicht).
#    Reihenfolge: NGINX-EINBAU.md.
#
# Alles geht an muuny-web; nur der Web-Dienst haelt die Schluessel fuer Autopilot
# und Laufzeit. Der Autopilot selbst ist von aussen NICHT erreichbar.

server {
  listen 80;
  listen 443 ssl;
  http2 on;
  server_name muuny.com www.muuny.com;

  ssl_certificate     /etc/nginx/certs/muuny.crt;
  ssl_certificate_key /etc/nginx/certs/muuny.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Zertifikatserneuerung (Let's Encrypt, webroot) — muss VOR dem 443-Zwang stehen.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
  }

  if ($scheme = http) { return 301 https://muuny.com$request_uri; }
  if ($host = www.muuny.com) { return 301 https://muuny.com$request_uri; }

  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 64k;

  resolver 127.0.0.11 valid=30s ipv6=off;
  set $muuny_web http://muuny-web:8098;

  # Der Chat streamt; auf dem Prozessor kann eine Antwort Minuten dauern.
  location = /api/chat {
    proxy_pass $muuny_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location / {
    proxy_pass $muuny_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }
}
