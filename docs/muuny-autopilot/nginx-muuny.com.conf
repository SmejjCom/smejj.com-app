# muuny.com — VORBEREITET, NOCH NICHT EINGEBAUT (Stand 20.09.2026).
#
# Diese Datei aendert nichts, solange sie nicht in den nginx-Container gemountet
# und nginx neu geladen wurde. Der Einbau steht in /opt/muuny/NGINX-EINBAU.md.
#
# Sie folgt dem Muster der bestehenden con.ax-Bloecke in core-edge.conf
# (listen 80/443, Zertifikate unter /etc/nginx/certs, ACME ueber /var/www/letsencrypt).
#
# WICHTIG: muuny-autopilot lauscht auf 127.0.0.1:8096 des HOSTS. Aus dem
# nginx-Container ist der Host unter host.docker.internal erreichbar, wenn der
# Container mit --add-host=host.docker.internal:host-gateway laeuft. Sauberer ist,
# muuny-autopilot in dasselbe Docker-Netz zu haengen und ihn beim Namen zu rufen
# (upstream muuny_autopilot -> muuny-autopilot:8080). Beides steht im Einbau-Text.

upstream muuny_autopilot {
  server muuny-autopilot:8080;
  keepalive 8;
}

server {
  listen 80;
  listen 443 ssl;
  http2 on;
  server_name muuny.com www.muuny.com;

  # Vor dem ersten Start mit certbot holen (siehe NGINX-EINBAU.md).
  ssl_certificate     /etc/nginx/certs/muuny.crt;
  ssl_certificate_key /etc/nginx/certs/muuny.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Zertifikatserneuerung (Let's Encrypt, webroot) — muss VOR dem 443-Zwang stehen.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
  }

  # Kein Klartext ausser ACME.
  if ($scheme = http) { return 301 https://$host$request_uri; }

  # DER ALIAS. Die Anwendung fragt diese Adresse und NIE eine feste Versionsnummer.
  # Offen und ohne Schluessel: er verraet nur, welche Gewichte gerade bedienen.
  # Kurz zwischengespeichert, weil ihn jede Anfrage liest, ein Wechsel aber
  # hoechstens alle paar Minuten vorkommt.
  location = /v1/alias {
    proxy_pass http://muuny_autopilot;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_cache_valid 200 10s;
    add_header X-Muuny-Alias "muuny-stable" always;
  }

  # Betriebsdaten der ausgelieferten Version. OHNE diese Meldungen kann sich keine
  # Canary je bewaehren — sie haengt dann fuer immer bei 10 Prozent.
  location = /v1/betrieb {
    limit_except POST { deny all; }
    client_max_body_size 64k;
    proxy_pass http://muuny_autopilot;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }

  # Dashboard und Betriebsdaten: NUR mit Verwaltungsschluessel (der Dienst selbst
  # prueft ihn; hier zusaetzlich die Suchmaschinen aussperren).
  location /api/muuny/ {
    proxy_pass http://muuny_autopilot;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location = /health {
    proxy_pass http://muuny_autopilot;
    access_log off;
  }

  # Alles andere: noch nichts da. Bewusst 503 statt einer leeren Seite, damit
  # niemand glaubt, die Anwendung sei kaputt.
  location / {
    default_type text/plain;
    return 503 "muuny.com — im Aufbau. Der Alias antwortet unter /v1/alias.\n";
  }
}
