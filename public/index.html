<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f2937">
    <meta name="description" content="smejj.com ist eine Free-safe KI- und Code-Assistent-Plattform mit GitHub Free, Cloudflare Free und IDrive e2 als Hauptspeicher.">
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1">
    <link rel="canonical" href="https://smejj.com/">
    <link rel="alternate" hreflang="de" href="https://smejj.com/">
    <link rel="alternate" hreflang="x-default" href="https://smejj.com/">
    <title>smejj.com Code MVP</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="sidebar">
        <h1>smejj.com Code</h1>
        <p class="note">Free-safe PWA shell. GitHub und Cloudflare bleiben dauerhaft im Free-Tarif; zentrale Daten gehoeren in IDrive e2.</p>
        <label>
          Dateien
          <textarea id="files" spellcheck="false" placeholder="src/server.js"></textarea>
        </label>
        <button id="status">Git-Status</button>
        <button id="tests">Tests ausfuehren</button>
        <button id="storage">IDrive e2 pruefen</button>
      </section>
      <section class="workspace">
        <div id="log" class="log"></div>
        <form id="form" class="composer">
          <textarea id="message" placeholder="Was soll der Agent im Projekt pruefen oder aendern?"></textarea>
          <button>Senden</button>
        </form>
      </section>
    </main>
    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
