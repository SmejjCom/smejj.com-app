# smejj.com — Qualitaets-Pruefer (Autopilot 01) als GitHub Action.
#
# WARUM ES DAS GIBT (2026-08-15): Autopilot 01 lief auf dem Zeabur-Dienst
# smejj-autopilot-jobs. Diesen Dienst gibt es nicht mehr (er steht in keinem
# Zeabur-Projekt, jede Route antwortet 404). Der letzte Messlauf war am
# 13.08. — seither misst niemand mehr, ob die Antwortqualitaet stimmt.
#
# Dass das keine Kleinigkeit ist, hat derselbe Tag gezeigt: Der Chat gab am
# 15.08. auf JEDE Frage den Rueckfall-Text aus, und keine Messung schlug an.
# Ein laufender Qualitaets-Pruefer haette das binnen Stunden gemeldet.
#
# WAS DER LAUF MACHT — er nutzt die erprobte Kette unveraendert:
#   1. scripts/verlauf/mint-eval-token.mjs stellt ein Mess-Token aus
#   2. scripts/verlauf/messlauf.mjs faehrt die Suite smejj-chat-core-v1
#      (14 Faelle x 3 Laeufe, 5,5 s Abstand) gegen den ECHTEN Nutzerweg
#   3. das Ergebnis wird nach public/verlauf-messwerte.json fortgeschrieben
#      und hier ins Repo committet
#
# DIE WICHTIGSTE REGEL DES MESSLAUFS gilt unveraendert: ein gescheiterter
# Transport ist KEINE schlechte Note. Faelle mit Transportfehler fuehren zum
# Abbruch ohne Schreiben — lieber ein alter Stand als eine falsche Zahl.
#
# EINMALIG NOETIG (macht der Betreiber selbst):
#   Secret SMEJJ_SESSION_SECRET im Repo hinterlegen — derselbe Wert wie im
#   Control-Server.
#
#   ABWAEGUNG, die dazugehoert: Mit diesem Geheimnis lassen sich Sitzungen
#   fuer JEDES Konto ausstellen. Es in die GitHub-Secrets zu legen, ist eine
#   zweite Kopie an einem weiteren Ort — GitHub-Secrets sind verschluesselt
#   und in Logs maskiert, aber wer Schreibrecht auf dieses Repo hat, koennte
#   sie ueber einen eigenen Workflow auslesen. Das Repo ist oeffentlich
#   LESBAR, nicht schreibbar; Pull Requests von aussen bekommen keine Secrets.
#   Wer das nicht will, hat eine Alternative: den Messlauf im Control-Server
#   selbst takten (dort liegt das Geheimnis ohnehin) — mehr Arbeit, aber
#   ohne zweite Kopie. Diese Entscheidung gehoert dem Betreiber.
#
# BEWUSST NICHT ENTHALTEN: der Push ins Frontend-Repo, der die Note auf der
# oeffentlichen Qualitaetsseite veroeffentlicht (Schritt 4 in
# scripts/verlauf/messlauf-taeglich.sh). Der braucht ein zweites Token mit
# Schreibrecht auf ein FREMDES Repo. Hier benannt statt stillschweigend
# uebergangen: die Messung laeuft und wird im App-Repo festgehalten, die
# oeffentliche Seite bleibt vorerst auf ihrem Stand.
name: Qualitaets-Messlauf

# ZEITPLAN STILLGELEGT (2026-08-15, Betreiber-Entscheidung noch am selben Tag):
# Auf die Rueckfrage, wie der Messlauf an sein Geheimnis kommen soll, fiel die
# Wahl auf "im Control-Server takten" — dort liegt SMEJJ_SESSION_SECRET
# ohnehin, es braucht also keine zweite Kopie in den GitHub-Secrets.
#
# Dieser Workflow bleibt als von Hand ausloesbarer Ersatzweg bestehen (er ist
# geprueft und einsatzbereit, sobald das Secret hinterlegt wird), faehrt aber
# KEINEN Zeitplan mehr: sonst schluege er zweimal taeglich rot fehl, waehrend
# der eigentliche Messlauf woanders laeuft — und eine dauerhaft rote Wache
# liest irgendwann niemand mehr.
#
# Sobald der Control-Autopilot laeuft, kann diese Datei geloescht werden.
on:
  workflow_dispatch: {}

permissions:
  # Schreibrecht nur fuer den einen Commit der Messwert-Datei.
  contents: write

concurrency:
  group: qualitaets-messlauf
  cancel-in-progress: false

jobs:
  messen:
    runs-on: ubuntu-latest
    # 42 Aufrufe mit 5,5 s Abstand sind gut 4 Minuten; 25 lassen Luft fuer
    # langsame Antworten, ohne dass ein Haenger eine Stunde Minuten frisst.
    timeout-minutes: 25
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mess-Token ausstellen
        id: token
        env:
          SMEJJ_SESSION_SECRET: ${{ secrets.SMEJJ_SESSION_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SMEJJ_SESSION_SECRET}" ]; then
            echo "::error::Secret SMEJJ_SESSION_SECRET fehlt — es wurde NICHTS gemessen. Anleitung im Kopf dieser Datei."
            exit 1
          fi
          # Der Token geht ueber die Schritt-Ausgabe, nicht ueber das Log.
          TOKEN="$(node scripts/verlauf/mint-eval-token.mjs)"
          if [ "${#TOKEN}" -lt 20 ]; then
            echo "::error::Mess-Token ist unbrauchbar kurz (${#TOKEN} Zeichen) — Lauf abgebrochen."
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "Mess-Token ausgestellt (${#TOKEN} Zeichen)."

      - name: Messlauf gegen die Live-Kette
        env:
          SMEJJ_EVAL_SESSION_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/verlauf/messlauf.mjs

      - name: Ergebnis festhalten
        run: |
          set -euo pipefail
          DATEI="public/verlauf-messwerte.json"
          # Kein `git add -A`: nur die eine Datei, die der Messlauf schreibt.
          if git diff --quiet -- "${DATEI}"; then
            echo "Keine Aenderung an ${DATEI} — nichts zu committen."
            echo "Das ist KEIN Fehler: der Messlauf schreibt bewusst nichts, wenn der Transport scheiterte."
            exit 0
          fi
          PUNKTE=$(node -e "const d=require('./${DATEI}');const m=d.messungen[d.messungen.length-1];console.log((m.punktzahl*100).toFixed(2)+' %, '+m.kritischeFehler+' kritisch, '+m.urteil)")
          echo "Ergebnis: ${PUNKTE}"
          git config user.name "smejj Qualitaets-Pruefer"
          git config user.email "s@smejj.com"
          git add -- "${DATEI}"
          git commit -q -m "chore(qualitaet): Messlauf $(date -u +%F) — ${PUNKTE}"
          git push
          echo "::notice::Messlauf ${PUNKTE}"
